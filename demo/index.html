<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irrigation Zone · Kartenvorschau</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#f3f5f0;color:#243e34;font-family:Inter,system-ui,sans-serif} main{max-width:1230px;margin:auto;padding:56px 32px} .kicker{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#708478} h1{font-size:clamp(30px,5vw,46px);font-weight:500;letter-spacing:-2px;margin:12px 0} .intro{color:#718077;font-size:14px;line-height:1.7;max-width:580px} .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:40px} button{font:inherit;border:1px solid #d8e2da;border-radius:20px;padding:10px 18px;background:transparent;color:inherit;cursor:pointer} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start} .caption{margin-top:18px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7d8c81} footer{font-size:12px;color:#7d8c81;margin-top:44px} body.dark{background:#141c19;color:#e0e9e2;--ha-card-background:#1d2923;--primary-text-color:#e0e9e2;--secondary-text-color:#96a99c;--divider-color:#344139;--ha-card-border-color:#344139;--iz-green:#7bb99a;--iz-blue:#84b6d1;--iz-amber:#d6ae6a} @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:680px){main{padding:30px 18px}.grid{grid-template-columns:1fr;max-width:420px;margin:auto}.toolbar{align-items:flex-start}button{font-size:12px;padding:9px 12px} .intro{font-size:12px}}
</style>
<main>
  <div class="kicker">Irrigation Zone Card / 0.1</div>
  <div class="toolbar"><div><h1>Ein Blick. Alles im Grünen.</h1><div class="intro">Eine Zone, ein klarer Überblick. Wasserbedarf, Bodenfeuchte und Ventilstatus finden zusammen ihren Platz.</div></div><button id="theme">Hell / Dunkel</button></div>
  <div class="grid" id="cards"></div>
  <footer>Interaktive Vorschau mit Beispieldaten · Keine Verbindung zu echten Ventilen</footer>
</main>
<script type="module" src="/demo/preview.js"></script>
</html>
